<div class="container mt-6">
  <h2 class="title has-text-centered has-text-white ">Player Configuration</h2>


  <form class="box has-background-dark" style="max-width: 600px; margin: 0 auto;">
    <!-- PLAYER 1 -->
    <div class="field">
      <label class="label has-text-white">White</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select id="player1-select" >
            <option value="human">Human</option>
            <option value="ai">AI</option>
          </select>
        </div>
      </div>

      <div id="player1-api" class="field mt-2 is-hidden">
        <label class="label has-text-white">White AI API URL</label>
        <div class="control">
          <input class="input" type="url" placeholder="https://jocasal-chessaithon.hf.space/predict">
        </div>
      </div>
    </div>

    <!-- PLAYER 2 -->
    <div class="field">
      <label class="label has-text-white">Black</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select id="player2-select" >
            <option value="human">Human</option>
            <option value="ai">AI</option>
          </select>
        </div>
      </div>

      <div id="player2-api" class="field mt-2 is-hidden">
        <label class="label has-text-white">Black AI API URL</label>
        <div class="control">
          <input class="input" type="url" placeholder="https://jocasal-chessaithon.hf.space/predict">
        </div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="field">
      <label class="label has-text-white">AI Settings</label>
      <div class="field">
        <label class="label has-text-white" title="Number of MCTS simulations per AI decision. Higher values are usually stronger but slower.">Simulations</label>
        <div class="control">
          <input id="ai-simulations" class="input" type="number" min="1" max="10000" value="400" title="Number of MCTS simulations per AI decision. Higher values are usually stronger but slower.">
        </div>
      </div>
      <div class="field mt-2">
        <label class="label has-text-white" title="Exploration constant for MCTS. Lower values focus on best-known moves, higher values explore more.">PUCT</label>
        <div class="control">
          <input id="ai-puct" class="input" type="number" min="0.01" max="2.00" step="0.01" value="1.00" title="Exploration constant for MCTS. Lower values focus on best-known moves, higher values explore more.">
        </div>
      </div>
      <div class="field mt-3">
        <label class="checkbox has-text-white" title="AI will suggest the top 5 moves and wait for the human to play one.">
          <input id="ai-suggest-only" type="checkbox" title="AI will suggest the top 5 moves and wait for the human to play one.">
          Suggest moves only (no auto-play)
        </label>
      </div>
    </div>

    <!-- SUBMIT BUTTON -->
    <div class="field has-text-centered mt-5">
      <div class="control buttons is-centered">
        <button id="start_game" class="button is-link" type="button">Start Game</button>
        <button id="ai_toggle" class="button is-warning" type="button">Stop IA</button>
      </div>
    </div>
  </form>

</div>

</script>
